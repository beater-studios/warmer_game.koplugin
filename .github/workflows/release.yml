name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y luajit zip
      - name: Check tag against _meta.lua
        run: |
          version="$(luajit -e 'print(dofile("_meta.lua").version)')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in _meta.lua"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Extract release notes
        run: |
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Download sources
        run: tools/data/fetch_sources.sh "$RUNNER_TEMP/sources"
      - name: Build data
        run: LUAJIT=luajit python3 -I tools/data/build_data.py "$RUNNER_TEMP/sources" build
      - name: Check that the word lists match the repository
        run: |
          if ! git diff --exit-code -- data; then
            echo "::error::The generated word lists differ from the committed ones"
            exit 1
          fi
      - name: Validate the three sizes
        run: |
          luajit tools/validate_data.lua build/100
          luajit tools/validate_data.lua build/150
          luajit tools/validate_data.lua build/300
      - name: Engine and vectors tests
        run: |
          luajit tests/engine_spec.lua
          luajit tests/vectors_spec.lua
      - name: Build packages
        run: tools/package.sh
      - name: Attach packages to the release
        run: gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
      - name: Fill empty release notes
        run: |
          if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            gh release edit "$TAG" --notes-file notes.md
          fi
